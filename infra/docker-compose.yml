services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: xai_report_builder
      POSTGRES_USER: xai
      POSTGRES_PASSWORD: xai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      args:
        INSTALL_LOCAL_AI: ${INSTALL_LOCAL_AI:-0}
        INSTALL_OCR: ${INSTALL_OCR:-1}
    environment:
      XAI_APP_DATABASE_URL: postgresql+psycopg://xai:xai@postgres:5432/xai_report_builder
      XAI_APP_REDIS_URL: redis://redis:6379/0
      XAI_APP_STORAGE_PATH: /app/storage
      XAI_APP_SECRET_KEY: change-me-change-me-change-me-123
      XAI_APP_ACCESS_TOKEN_TTL_MINUTES: 60
      XAI_APP_REFRESH_TOKEN_TTL_MINUTES: 4320
      XAI_APP_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      XAI_APP_BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!
      XAI_APP_AI_RUNTIME_PROFILE: ${XAI_APP_AI_RUNTIME_PROFILE:-baseline}
      XAI_APP_EMBEDDING_PROVIDER: ${XAI_APP_EMBEDDING_PROVIDER:-ollama}
      XAI_APP_LLM_PROVIDER: ${XAI_APP_LLM_PROVIDER:-ollama}
      XAI_APP_OCR_PROVIDER: ${XAI_APP_OCR_PROVIDER:-tesseract}
      XAI_APP_OLLAMA_BASE_URL: ${XAI_APP_OLLAMA_BASE_URL:-http://host.docker.internal:11434/api}
      XAI_APP_OLLAMA_EMBEDDING_MODEL: ${XAI_APP_OLLAMA_EMBEDDING_MODEL:-all-minilm}
      XAI_APP_OLLAMA_LLM_MODEL: ${XAI_APP_OLLAMA_LLM_MODEL:-gemma3:270m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
      - backend_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ../backend
      args:
        INSTALL_LOCAL_AI: ${INSTALL_LOCAL_AI:-0}
        INSTALL_OCR: ${INSTALL_OCR:-1}
    environment:
      XAI_APP_DATABASE_URL: postgresql+psycopg://xai:xai@postgres:5432/xai_report_builder
      XAI_APP_REDIS_URL: redis://redis:6379/0
      XAI_APP_STORAGE_PATH: /app/storage
      XAI_APP_SECRET_KEY: change-me-change-me-change-me-123
      XAI_APP_CELERY_TASK_ALWAYS_EAGER: "0"
      XAI_APP_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      XAI_APP_BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!
      XAI_APP_AI_RUNTIME_PROFILE: ${XAI_APP_AI_RUNTIME_PROFILE:-baseline}
      XAI_APP_EMBEDDING_PROVIDER: ${XAI_APP_EMBEDDING_PROVIDER:-ollama}
      XAI_APP_LLM_PROVIDER: ${XAI_APP_LLM_PROVIDER:-ollama}
      XAI_APP_OCR_PROVIDER: ${XAI_APP_OCR_PROVIDER:-tesseract}
      XAI_APP_OLLAMA_BASE_URL: ${XAI_APP_OLLAMA_BASE_URL:-http://host.docker.internal:11434/api}
      XAI_APP_OLLAMA_EMBEDDING_MODEL: ${XAI_APP_OLLAMA_EMBEDDING_MODEL:-all-minilm}
      XAI_APP_OLLAMA_LLM_MODEL: ${XAI_APP_OLLAMA_LLM_MODEL:-gemma3:270m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
      - backend_storage:/app/storage
    depends_on:
      - postgres
      - redis
    command: sh -c "celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=$${CELERY_CONCURRENCY:-4} --prefetch-multiplier=1"

  ollama:
    profiles:
      - local-ai
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-admin-api
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - alertmanager

  alertmanager:
    profiles:
      - observability
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    profiles:
      - observability
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ChangeMe123!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  backend_storage:
  ollama_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
