global:
  resolve_timeout: 5m

route:
  receiver: default-log
  group_by:
    - alertname
    - service
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: critical-log
      matchers:
        - severity="critical"

receivers:
  - name: default-log
  - name: critical-log

templates: []
