global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: xai-backend
    metrics_path: /api/system/metrics/prometheus
    static_configs:
      - targets:
          - backend:8000
        labels:
          service: backend-api
          stack: xai-report-builder
